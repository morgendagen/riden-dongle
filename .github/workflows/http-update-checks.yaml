name: HTTP update checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp12e-and-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PlatformIO
        run: python -m pip install -r requirements.txt
      - name: Build ESP-12E / ESP-12F
        run: pio run -e esp12e
        env:
          VERSION: upstream-http-update
      - name: Run production-code regression tests
        run: python test/host/run_update_tests.py
